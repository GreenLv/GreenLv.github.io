<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1160" viewBox="0 0 780 1160" role="img" aria-labelledby="title desc">
  <title id="title">SkillFerry mobile portability flow</title><desc id="desc">A target-neutral workspace, portability plan, and three target configurations are arranged vertically. Secret values resolve locally.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a2d"/><stop offset="1" stop-color="#0b3650"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#64d7e8"/></marker><style>.h{font:700 30px Inter,Arial,sans-serif;fill:#f7fbff}.b{font:600 24px Inter,Arial,sans-serif;fill:#f7fbff}.n{font:500 20px Inter,Arial,sans-serif;fill:#bceef4}.g{font:700 17px ui-monospace,Menlo,monospace;fill:#071a2d}</style></defs>
  <rect width="780" height="1160" rx="32" fill="url(#bg)"/><text x="390" y="58" text-anchor="middle" class="h">One definition, several target outcomes</text>
  <rect x="100" y="96" width="580" height="250" rx="24" fill="#12364e" stroke="#4cc8d9" stroke-width="2"/><text x="390" y="140" text-anchor="middle" class="b">Target-neutral workspace</text><text x="390" y="190" text-anchor="middle" class="n">Skills · global rules · non-secret MCP templates</text><rect x="230" y="224" width="320" height="48" rx="16" fill="#f2ad3d"/><text x="390" y="255" text-anchor="middle" class="g">secret:env/NAME</text><text x="390" y="315" text-anchor="middle" class="n">Sessions, caches, memory, and auth stay outside</text>
  <path d="M390 354V410" stroke="#64d7e8" stroke-width="6" marker-end="url(#a)"/>
  <rect x="100" y="430" width="580" height="282" rx="24" fill="#12364e" stroke="#f2ad3d" stroke-width="2"/><text x="390" y="478" text-anchor="middle" class="b">plan: explain before writing</text><rect x="178" y="512" width="200" height="45" rx="22" fill="#78e1bf"/><text x="278" y="541" text-anchor="middle" class="g">native</text><rect x="402" y="512" width="200" height="45" rx="22" fill="#65d8e9"/><text x="502" y="541" text-anchor="middle" class="g">translated</text><rect x="250" y="578" width="280" height="45" rx="22" fill="#f2ad3d"/><text x="390" y="607" text-anchor="middle" class="g">degraded / manual</text><text x="390" y="671" text-anchor="middle" class="n">paths · origins · losses · conflicts</text>
  <path d="M390 720V776" stroke="#64d7e8" stroke-width="6" marker-end="url(#a)"/>
  <rect x="100" y="796" width="580" height="286" rx="24" fill="#12364e" stroke="#4cc8d9" stroke-width="2"/><text x="390" y="842" text-anchor="middle" class="b">Native target configurations</text><rect x="166" y="874" width="448" height="48" rx="15" fill="#19425c"/><text x="390" y="906" text-anchor="middle" class="b">Codex</text><rect x="166" y="938" width="448" height="48" rx="15" fill="#19425c"/><text x="390" y="970" text-anchor="middle" class="b">Claude Code</text><rect x="166" y="1002" width="448" height="48" rx="15" fill="#19425c"/><text x="390" y="1034" text-anchor="middle" class="b">DeepSeek Harness</text>
  <text x="390" y="1122" text-anchor="middle" class="n">Secret values resolve locally at apply time</text>
</svg>
