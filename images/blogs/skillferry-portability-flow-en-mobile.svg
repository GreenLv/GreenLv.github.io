<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1740" viewBox="0 0 780 1740" role="img" aria-labelledby="title desc">
  <title id="title">SkillFerry mobile portability flow</title><desc id="desc">A target-neutral workspace passes through a portability plan into Codex, Claude Code, and DeepSeek Harness configurations. Secret values resolve locally.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a2d"/><stop offset="1" stop-color="#0b3650"/></linearGradient><marker id="a" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#64d7e8"/></marker><style>.h{font:700 40px Inter,Arial,sans-serif;fill:#f7fbff}.b{font:600 34px Inter,Arial,sans-serif;fill:#f7fbff}.n{font:500 33px Inter,Arial,sans-serif;fill:#bceef4}.g{font:700 33px ui-monospace,Menlo,monospace;fill:#071a2d}</style></defs>
  <rect width="780" height="1740" rx="32" fill="url(#bg)"/><text x="390" y="65" text-anchor="middle" class="h">One workspace; every agent</text><text x="390" y="115" text-anchor="middle" class="h">is a render target</text>
  <rect x="70" y="160" width="640" height="420" rx="28" fill="#12364e" stroke="#4cc8d9" stroke-width="3"/><text x="390" y="220" text-anchor="middle" class="b">Target-neutral workspace</text><text x="390" y="280" text-anchor="middle" class="n">Skills · global rules · MCP templates</text><text x="390" y="330" text-anchor="middle" class="n">store references, not secret values</text><rect x="170" y="360" width="440" height="65" rx="18" fill="#f2ad3d"/><text x="390" y="403" text-anchor="middle" class="g">secret:env/NAME</text><text x="390" y="485" text-anchor="middle" class="n">sessions · caches · memory · auth</text><text x="390" y="535" text-anchor="middle" class="n">stay on this machine</text>
  <path d="M390 590V650" stroke="#64d7e8" stroke-width="7" marker-end="url(#a)"/>
  <rect x="70" y="680" width="640" height="430" rx="28" fill="#12364e" stroke="#f2ad3d" stroke-width="3"/><text x="390" y="745" text-anchor="middle" class="b">plan: explain before writing</text><rect x="112" y="790" width="250" height="60" rx="28" fill="#78e1bf"/><text x="237" y="830" text-anchor="middle" class="g">native</text><rect x="418" y="790" width="250" height="60" rx="28" fill="#65d8e9"/><text x="543" y="830" text-anchor="middle" class="g">translated</text><rect x="112" y="875" width="250" height="60" rx="28" fill="#f2ad3d"/><text x="237" y="915" text-anchor="middle" class="g">degraded</text><rect x="418" y="875" width="250" height="60" rx="28" fill="#f2ad3d"/><text x="543" y="915" text-anchor="middle" class="g">manual</text><text x="390" y="995" text-anchor="middle" class="n">paths · origins · losses · conflicts</text><text x="390" y="1045" text-anchor="middle" class="n">see the difference before apply</text>
  <path d="M390 1120V1180" stroke="#64d7e8" stroke-width="7" marker-end="url(#a)"/>
  <rect x="70" y="1210" width="640" height="400" rx="28" fill="#12364e" stroke="#4cc8d9" stroke-width="3"/><text x="390" y="1275" text-anchor="middle" class="b">Native target configurations</text><rect x="130" y="1325" width="520" height="65" rx="16" fill="#19425c"/><text x="390" y="1368" text-anchor="middle" class="b">Codex</text><rect x="130" y="1415" width="520" height="65" rx="16" fill="#19425c"/><text x="390" y="1458" text-anchor="middle" class="b">Claude Code</text><rect x="130" y="1505" width="520" height="65" rx="16" fill="#19425c"/><text x="390" y="1548" text-anchor="middle" class="b">DeepSeek Harness</text>
  <text x="390" y="1685" text-anchor="middle" class="n">Secrets resolve locally at apply</text>
</svg>
